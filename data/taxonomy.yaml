techniques:
  semantic_alignment: 语义对齐
  feature_distillation: 特征蒸馏
  geometry: 几何一致性
  region_aggregation: 区域 / 超点聚合
  reliability: 可靠性 / 不确定性
  temporal: 时序 / 记忆
  fusion: 多模型 / 多模态融合
  retrieval: 检索增强
  prompt: 概念 / 文本提示
  efficient_inference: 高效推理
datasets:
  ScanNet: 室内 RGB-D 重建场景；记录 v2 / 200 与类别协议
  Matterport3D: 建筑室内多视角场景；记录 21 / 40 / 80 / 160 类等协议
  nuScenes: 室外驾驶多传感器场景；标签与提示映射需单独核查
  Replica: 合成室内三维场景
  ADE20K: 图像语义 / 全景分割；150 / 847 类需区分
  PASCAL: VOC 与 Context；20 / 21 / 59 / 60 / 459 类需区分
  COCO: Stuff / Panoptic / Object 的训练与评测设置需区分
  Cityscapes: 城市道路图像分割
  MESS: 22 数据集跨域评测集合；不能当作单一数据集
  SA-Co: 概念提示分割评测；不是普通语义分割协议
  LV-VIS: 大词汇视频实例分割
  BURST: 视频对象分割与跟踪评测
  VIPSeg: 视频全景分割
  ORFD: 室外可通行区域评测；具体任务见论文
  TartanAir: 仿真多视角场景
  LERF: 三维语言场景评测
  3D-OVS: 三维语言场景开放词汇评测
  Mip-NeRF360: 多视角场景集合
